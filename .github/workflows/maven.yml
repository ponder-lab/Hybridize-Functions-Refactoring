# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven
on:
  push:
    # GitHub Merge Queue creates branches under `refs/heads/gh-readonly-queue/...` and pushes
    # the queue's test commit there. That push fires this workflow's `push:` trigger AS WELL
    # AS the `merge_group:` trigger — two runs in the same concurrency group, where the second
    # cancels the first. The cancelled run is reported as failed to the merge queue, which
    # kicks the PR out. Filtering out those branches from `push:` lets `merge_group:` be the
    # sole trigger for queue-branch pushes.
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
  merge_group:
  schedule:
  - cron: "0 2 * * 5"
concurrency:
  # Group includes the workflow name so merge_group runs from different workflows don't collide.
  # Cancel-in-progress is allowed for `pull_request` (new push to PR supersedes prior runs) and
  # for non-tag `push` events (commits to a branch supersede prior runs); explicitly NOT for
  # `merge_group` events, because GitHub Merge Queue spawns concurrent runs on the queue branch
  # and cancellation marks the cancelled run as failed, kicking the PR out of the queue. Same
  # fix as ponder-lab/ML#217.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Fail on whitespace errors
      run: git show HEAD --check
    - name: Run Spotless
      run: ./mvnw -s .travis.settings.xml -Dgithub.username=${{ github.actor }} -Dgithub.password=${{ secrets.GITHUB_TOKEN }} spotless:check -B
    - name: Cache Pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install global requirements
      run: pip3.10 install -r requirements.txt
    - name: Run Black
      run: black --fast --check --extend-exclude \/out .
    - name: Test the strip-and-re-infer harness
      working-directory: edu.cuny.hunter.hybridize.eval/reinfer
      run: python3.10 -m unittest -v test_spec test_strip test_join test_run test_runner
    - name: Install test requirements
      run: pip3.10 install -r edu.cuny.hunter.hybridize.tests/requirements.txt
    - name: Install with Maven
      run: ./mvnw -U -s .travis.settings.xml -Dgithub.username=${{ github.actor }} -Dgithub.password=${{ secrets.GITHUB_TOKEN }} -Dlogging.config.file=\${maven.multiModuleProjectDirectory}/logging.ci.properties -DtrimStackTrace=true -Dtycho.showEclipseLog=false install -B -q -DskipTests=true
    - name: Print Python 3 version.
      run: python3 --version
    - name: Print Python 3.10 version.
      run: python3.10 --version
    - name: Clone our fork of PyDev
      run: |
        mkdir "$HOME/git"
        pushd "$HOME/git"
        git clone --depth=50 --branch=pydev_9_3 https://github.com/ponder-lab/Pydev.git
        popd
    - name: Test with Maven
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      # Skip the Coveralls upload when no token is available (Dependabot and fork PRs do not receive repository secrets), so coverage
      # reporting stays best-effort and a token-less run does not fail the build. Runs with the token (including Dependabot once the token
      # is also added as a Dependabot secret) still upload.
      run: ./mvnw -U -s .travis.settings.xml -Dgithub.username=${{ github.actor }} -Dgithub.password=${{ secrets.GITHUB_TOKEN }} -Dlogging.config.file=\${maven.multiModuleProjectDirectory}/logging.ci.properties -DtrimStackTrace=true -Dtycho.showEclipseLog=false -B verify -Pjacoco coveralls:report -Dcoveralls.skip=${{ secrets.COVERALLS_REPO_TOKEN == '' }}
    - name: Print the resolved engine build
      # The builds run with `-q`, so the log never names the engine snapshot that resolved. Record the Ariadne jar the build resolved, with its
      # SHA-1, comparable against the registry's published `.sha1`. For a snapshot, the resolved jar is the one named by the `<timestamp>` and
      # `<buildNumber>` in the repository metadata `-U` refreshed; for a release, it is the jar at the pinned version. The Maven cache can carry
      # jars of other versions and snapshots, and a `bnd-*` directory holds Tycho's wrapped copy, whose generated manifest gives it a different
      # SHA-1 from the downloaded jar; both are counted, not printed. The other wrapped WALA bundles are releases and are listed in full.
      if: always()
      run: |
        repo="$HOME/.m2/repository/com/ibm/wala"
        ml="$repo/com.ibm.wala.cast.python.ml"
        dependency=$(grep -A4 '<artifactId>com.ibm.wala.cast.python.ml</artifactId>' hybridize.target)
        version=$(echo "$dependency" | sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p' | head -n 1)
        classifier=$(echo "$dependency" | sed -n 's/.*<classifier>\(.*\)<\/classifier>.*/\1/p' | head -n 1)
        echo "### Resolved engine build" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "Pinned ML version: \`$version\`" | tee -a "$GITHUB_STEP_SUMMARY"
        resolved=""
        if [ ! -d "$ml/$version" ]; then
          echo "- com.ibm.wala.cast.python.ml $version: not resolved" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          expected=""
          case "$version" in
            *-SNAPSHOT)
              metadata=$(find "$ml/$version" -maxdepth 1 -name 'maven-metadata-*.xml' ! -name 'maven-metadata-local.xml' -type f | sort | head -n 1)
              if [ -z "$metadata" ]; then
                echo "- No snapshot metadata for \`$version\`; cannot tell which cached jar resolved" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                timestamp=$(sed -n 's/.*<timestamp>\(.*\)<\/timestamp>.*/\1/p' "$metadata" | head -n 1)
                build=$(sed -n 's/.*<buildNumber>\(.*\)<\/buildNumber>.*/\1/p' "$metadata" | head -n 1)
                echo "- \`${metadata#"$repo/"}\` timestamp \`$timestamp\` build \`$build\`" | tee -a "$GITHUB_STEP_SUMMARY"
                if [ -z "$timestamp" ] || [ -z "$build" ]; then
                  echo "- The metadata names no timestamp and build; cannot tell which cached jar resolved" | tee -a "$GITHUB_STEP_SUMMARY"
                else
                  expected="${version%-SNAPSHOT}-$timestamp-$build"
                fi
              fi
              ;;
            *)
              expected="$version"
              ;;
          esac
          if [ -n "$expected" ]; then
            jar="$ml/$version/com.ibm.wala.cast.python.ml-$expected${classifier:+-$classifier}.jar"
            if [ -f "$jar" ]; then
              resolved="$jar"
              echo "- (resolved) \`${jar#"$repo/"}\` SHA-1 \`$(sha1sum "$jar" | cut -d ' ' -f 1)\`" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "- No cached jar matches \`${jar#"$repo/"}\`" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
        fi
        if [ -d "$ml" ]; then
          others=$(find "$ml" -name '*.jar' -type f ! -path '*/bnd-*' ! -path "$resolved" | wc -l)
          echo "- $others other cached ML jars not used (other versions or snapshots; Tycho's \`bnd-*\` copies are not counted)" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
        for artifact in com.ibm.wala.cast com.ibm.wala.core com.ibm.wala.ide com.ibm.wala.shrike com.ibm.wala.util; do
          dir="$repo/$artifact"
          if [ ! -d "$dir" ]; then
            echo "- $artifact: not resolved" | tee -a "$GITHUB_STEP_SUMMARY"
            continue
          fi
          find "$dir" -name '*.jar' -type f | sort | while read -r jar; do
            echo "- \`${jar#"$repo/"}\` SHA-1 \`$(sha1sum "$jar" | cut -d ' ' -f 1)\`" | tee -a "$GITHUB_STEP_SUMMARY"
          done
        done
